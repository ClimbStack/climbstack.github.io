<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - ClimbStack</title>
  
  <meta name="description" content="The page you are looking for does not exist. Return to ClimbStack base camp.">
  <meta name="theme-color" content="#0D1117">
  <meta name="robots" content="noindex, follow">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/climbstack.css">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="css/font-awesome/css/all.min.css">
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  
  <!-- Scripts -->
  <script src="js/i18n/climbstack_404.js" defer></script>
  <script src="js/i18n.js" defer></script>
</head>
<body class="climbstack-page">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--lu-border);">
    <div class="container" style="max-width: 1400px;">
      <a class="navbar-brand fw-bold" style="display: flex; align-items: center; gap: 0.75rem;" href="index.html" aria-label="ClimbStack Home">
        <img src="assets/icon.png" alt="ClimbStack Icon" width="32" height="32" style="border-radius: 6px;">
        <span>ClimbStack</span>
      </a>
      <div class="ms-auto">
        <a class="nav-link text-white" href="index.html"><i class="fas fa-arrow-left me-1"></i> Home</a>
      </div>
    </div>
  </nav>

  <main class="d-flex align-items-center justify-content-center text-center px-3" style="min-height: 80vh; padding-top: 6rem;">
    <div style="max-width: 560px;">
      <div class="mb-4" style="font-size: 4rem; color: var(--lu-accent);">
        <i class="fas fa-mountain"></i>
      </div>
      <h1 class="display-3 fw-bold mb-2" data-i18n="error_code" style="color: var(--lu-primary);">404</h1>
      <h2 class="h3 fw-semibold mb-3" data-i18n="error_title">Peak Not Found</h2>
      <p class="mb-4" data-i18n="error_desc" style="color: var(--lu-text-sec); font-size: 1.1rem; line-height: 1.6;">
        The trail you followed doesn't seem to exist. The page might have moved, or you may have mistyped the URL.
      </p>
      <a href="index.html" class="lu-btn lu-btn-primary">
        <i class="fas fa-home me-2"></i><span data-i18n="btn_home" data-i18n-raw>Back to Base Camp</span>
      </a>
    </div>
  </main>

  <!-- i18n Toggle Button Bottom Right -->
  <button type="button" id="i18n-toggle" class="btn btn-sm btn-outline-primary rounded-pill fw-semibold position-fixed bottom-0 end-0 m-4 shadow" style="z-index: 1050; background-color: var(--lu-bg-surface); color: var(--lu-primary); border-color: var(--lu-primary);" data-i18n-toggle>EN</button>

  <div id="site-footer"></div>
  <script src="js/footer.js" defer></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
